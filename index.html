<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79"><link rel="manifest" href="manifest.json?v=stable3"><title>출퇴근 인증 알림</title><link rel="stylesheet" href="style.css?v=stable3"></head><body><header class="topbar"><div class="brand"><img src="logo.png" alt="로고"><div><b>출퇴근 인증</b><small>기존 출퇴근 시스템 보조 · GPS 인증</small></div></div></header><main>
<section id="page-home" class="page active"><div class="card hero"><h2>오늘의 출퇴근</h2><p id="hello">설정에서 근무지와 알림을 설정해 주세요.</p><div class="big-actions"><button type="button" class="primary" id="btn-checkin">출근 인증</button><button type="button" class="secondary" id="btn-checkout">퇴근 인증</button></div><div id="gps-result" class="result"></div></div><div class="card"><h3>오늘의 인증</h3><div class="today-grid"><div><span>출근</span><strong id="today-in">미인증</strong></div><div><span>퇴근</span><strong id="today-out">미인증</strong></div></div></div><div class="card"><h3>🔔 알림</h3><p id="notify-status" class="muted">상태 확인 중…</p><button type="button" class="outline full" id="btn-notify">알림 권한 요청</button><button type="button" class="outline full" id="btn-test-notify">지금 알림 테스트</button><p id="next-alarm" class="muted"></p></div></section>
<section id="page-auth" class="page"><div class="card"><h2>인증</h2><p class="muted">근무지 반경 안에서만 GPS 인증합니다. 위치는 인증 순간에만 확인합니다.</p><div class="big-actions"><button type="button" class="primary" id="btn-checkin-2">출근 인증</button><button type="button" class="secondary" id="btn-checkout-2">퇴근 인증</button></div><div id="gps-result-2" class="result"></div></div></section>
<section id="page-history" class="page"><div class="card"><div class="section-head"><h2>인증 기록</h2><button type="button" class="small danger" id="btn-clear">전체 삭제</button></div><div id="history-list"></div><button type="button" class="outline full" id="btn-csv">CSV 다운로드</button></div></section>
<section id="page-settings" class="page"><div class="card"><h2>설정</h2><label>이름<input id="employee-name" placeholder="예: 홍길동"></label><label>근무지명<input id="workplace-name"></label><label>근무지 주소<input id="workplace-address" placeholder="예: 충북 청주시 ○○구 ○○로 ○○"></label><label>근무지 위도<input id="lat" type="number" step="any"></label><label>근무지 경도<input id="lng" type="number" step="any"></label><label>인증 반경(m)<input id="radius" type="number" min="10" value="100"></label><h3>알림 시간</h3><label>출근 알림<input id="work-time" type="time" value="08:50"></label><label>퇴근 알림<input id="off-time" type="time" value="18:00"></label><h3>알림 요일</h3><div class="days"><label><input class="day" type="checkbox" value="1">월</label><label><input class="day" type="checkbox" value="2">화</label><label><input class="day" type="checkbox" value="3">수</label><label><input class="day" type="checkbox" value="4">목</label><label><input class="day" type="checkbox" value="5">금</label><label><input class="day" type="checkbox" value="6">토</label><label><input class="day" type="checkbox" value="0">일</label></div><div class="quick"><button type="button" id="days-week">평일</button><button type="button" id="days-all">매일</button><button type="button" id="days-none">전체 해제</button></div><button type="button" class="primary full" id="btn-save">설정 저장</button><button type="button" class="outline full" id="btn-register-gps">현재 위치를 근무지로 등록</button><p id="settings-msg" class="muted"></p></div></section></main><nav class="bottom-nav"><button type="button" data-page="home" class="nav-btn active"><span>⌂</span>홈</button><button type="button" data-page="auth" class="nav-btn"><span>✓</span>인증</button><button type="button" data-page="history" class="nav-btn"><span>▤</span>기록</button><button type="button" data-page="settings" class="nav-btn"><span>⚙</span>설정</button></nav><div id="toast" class="toast"></div><script src="app.js?v=stable3"></script></body></html>
