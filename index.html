<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<title>출퇴근 인증 알림</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="logo.png" onerror="this.style.display='none'"><div><b>출퇴근 인증</b><small>GPS 기반 근무지 인증</small></div></div>
</header>

<main>
<section id="page-home" class="page active">
  <div class="card hero">
    <h2>출퇴근 인증</h2>
    <p id="hello">직원 정보를 설정해 주세요.</p>
    <div class="big-actions">
      <button class="primary" id="btn-checkin">출근 인증</button>
      <button class="secondary" id="btn-checkout">퇴근 인증</button>
    </div>
    <div id="gps-result" class="result"></div>
  </div>
  <div class="card">
    <h3>오늘의 인증</h3>
    <div class="today-grid">
      <div><span>출근</span><strong id="today-in">미인증</strong></div>
      <div><span>퇴근</span><strong id="today-out">미인증</strong></div>
    </div>
  </div>
  <div class="card">
    <h3>알림</h3>
    <button class="outline" id="btn-notify">알림 권한 요청</button>
    <button class="outline" id="btn-test-notify">알림 테스트</button>
    <p id="next-alarm" class="muted">평일 08:50 출근 / 18:00 퇴근 알림</p>
  </div>
</section>

<section id="page-history" class="page">
  <div class="card">
    <div class="section-head"><h2>인증 기록</h2><button class="small danger" id="btn-clear">전체 삭제</button></div>
    <div id="history-list"></div>
    <button class="outline full" id="btn-csv">CSV 다운로드</button>
  </div>
</section>

<section id="page-settings" class="page">
  <div class="card">
    <h2>설정</h2>
    <label>직원명<input id="employee-name" placeholder="예: 홍길동"></label>
    <label>직원번호<input id="employee-id" placeholder="예: 1234"></label>
    <label>근무지명<input id="workplace-name" value="가축위생방역지원본부 충북도본부"></label>
    <label>근무지 위도<input id="lat" type="number" step="any"></label>
    <label>근무지 경도<input id="lng" type="number" step="any"></label>
    <label>인증 반경(m)<input id="radius" type="number" min="10" value="100"></label>
    <button class="primary full" id="btn-save">설정 저장</button>
    <button class="outline full" id="btn-register-gps">현재 위치를 근무지로 등록</button>
    <p id="settings-msg" class="muted"></p>
  </div>
</section>

<section id="page-admin" class="page">
  <div class="card">
    <h2>관리자 준비 화면</h2>
    <p class="muted">현재 버전은 이 휴대폰에 저장된 기록을 기준으로 표시합니다.</p>
    <div class="stats">
      <div><span>기록 일수</span><strong id="stat-days">0</strong></div>
      <div><span>출근</span><strong id="stat-in">0</strong></div>
      <div><span>퇴근</span><strong id="stat-out">0</strong></div>
    </div>
    <p>※ 여러 직원의 기록을 중앙에서 관리하려면 다음 단계에서 서버 데이터베이스를 연결합니다.</p>
  </div>
</section>
</main>

<nav class="bottom-nav">
  <button data-page="home" class="nav-btn active"><span>⌂</span>홈</button>
  <button data-page="history" class="nav-btn"><span>▤</span>인증기록</button>
  <button data-page="settings" class="nav-btn"><span>⚙</span>설정</button>
  <button data-page="admin" class="nav-btn"><span>☷</span>관리</button>
</nav>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
